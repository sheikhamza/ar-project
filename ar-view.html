<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AR View</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; debugUIEnabled: true;"
>

  <!-- CUSTOM PATTERN -->
  <a-marker
    type="pattern"
    url="./restaurant.patt"
    id="restaurantMarker"
  >

    <!-- AR IMAGE -->
    <a-image
      id="arImage"
      width="2"
      height="2"
      position="0 0 0"
      rotation="-90 0 0"
    ></a-image>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>


<script>

  const params = new URLSearchParams(window.location.search);

  const img = params.get("img");

  const arImage = document.getElementById("arImage");

  if (img) {

    console.log("Image URL:", img);

    arImage.setAttribute("src", img);

  } else {

    // Testing ke liye local pizza image
    arImage.setAttribute("src", "./images/pizza.png");

  }


  const marker = document.getElementById("restaurantMarker");

  marker.addEventListener("markerFound", () => {

    console.log("✅ CUSTOM MARKER FOUND");

  });

  marker.addEventListener("markerLost", () => {

    console.log("❌ CUSTOM MARKER LOST");

  });

</script>

</body>
</html>
