<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>AR Menu Test</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #start {
            position: fixed;
            z-index: 9999;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        #start button {
            border: none;
            padding: 16px 25px;
            border-radius: 50px;
            background: #b8860b;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div id="start">
    <button id="startButton">
        Open AR Camera
    </button>
</div>

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
>

    <a-marker preset="hiro">

        <a-box
            position="0 0.5 0"
            material="color: #B8860B;"
        >
        </a-box>

        <a-text
            value="GOLDEN BITE"
            align="center"
            color="#ffffff"
            width="3"
            position="0 1.2 0"
            rotation="-90 0 0"
        >
        </a-text>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<script>

const startButton = document.getElementById("startButton");
const startScreen = document.getElementById("start");

startButton.addEventListener("click", async () => {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                }
            },
            audio: false
        });

        stream.getTracks().forEach(track => track.stop());

        startScreen.style.display = "none";

        console.log("Camera permission granted");

    } catch (error) {

        console.error("Camera error:", error);

        alert(
            "Camera permission nahi mili.\n\n" +
            "Browser settings mein Camera Allow karo."
        );

    }

});

</script>

</body>
</html>
