<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AR 360 View</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<style>
button {
  padding: 10px;
  margin: 5px;
  font-size: 16px;
  border-radius: 8px;
}
</style>

<body style="margin:0; overflow:hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- ✅ ASSETS (VERY IMPORTANT) -->
    <a-assets id="assets"></a-assets>

    <a-marker type="pattern" url="marker-pattern.patt">

      <a-image 
        id="product"
        position="0 0.5 0"
        width="2"
        height="2"
        material="transparent:true;">
      </a-image>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

<!-- CONTROLS -->
<div style="position:fixed; bottom:20px; left:20px; z-index:999;">
  <button onclick="prev()">⬅</button>
  <button onclick="next()">➡</button>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const productName = params.get("product") || "burger";

  function next(){
    index = (index + 1) % images.length;
    product.setAttribute("src", images[index]);
  }

  function prev(){
    index = (index - 1 + images.length) % images.length;
    product.setAttribute("src", images[index]);
  }

  const totalImages = 3;

  let images = [];
  const assets = document.querySelector("#assets");
  const product = document.querySelector("#product");

  let loaded = 0;
  let index = 0;

  // 🔥 LOAD IMAGES
  for(let i = 1; i <= totalImages; i++){
    let img = document.createElement("img");
    img.setAttribute("id", `img${i}`);
    img.setAttribute("src", `images/${productName}/${i}.png`);

    img.onload = () => {
      loaded++;
      if(loaded === totalImages){
        product.setAttribute("src", images[0]);
        startAutoRotate(); // 🔥 start spin
      }
    };

    assets.appendChild(img);
    images.push(`#img${i}`);
  }

  // 🔥 AUTO ROTATE
  let autoRotate;

  function startAutoRotate(){
    autoRotate = setInterval(() => {
      index = (index + 1) % images.length;
      product.setAttribute("src", images[index]);
    }, 800); // speed control (lower = faster)
  }

  // 🔥 DRAG ROTATION
  let startX = 0;
  let isDragging = false;

  document.addEventListener("touchstart", (e) => {
    clearInterval(autoRotate); // stop auto on touch
    isDragging = true;
    startX = e.touches[0].clientX;
  });

  document.addEventListener("touchmove", (e) => {
    if(!isDragging) return;

    let diff = e.touches[0].clientX - startX;

    if(Math.abs(diff) > 30){ // sensitivity
      if(diff > 0){
        index = (index - 1 + images.length) % images.length;
      } else {
        index = (index + 1) % images.length;
      }

      product.setAttribute("src", images[index]);
      startX = e.touches[0].clientX;
    }
  });

  document.addEventListener("touchend", () => {
    isDragging = false;
    startAutoRotate(); // resume auto
  });
</script>

</body>
</html>
