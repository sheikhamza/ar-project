<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AR 360 View</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<style>
button {
  padding: 10px;
  margin: 5px;
  font-size: 16px;
  border-radius: 8px;
}
</style>

<body style="margin:0; overflow:hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- ✅ ASSETS (VERY IMPORTANT) -->
    <a-assets id="assets"></a-assets>

    <a-marker preset="hiro">

      <a-image 
        id="product"
        position="0 0.5 0"
        width="2"
        height="2">
      </a-image>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

<!-- CONTROLS -->
<div style="position:fixed; bottom:20px; left:20px; z-index:999;">
  <button onclick="prev()">⬅</button>
  <button onclick="next()">➡</button>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const productName = params.get("product") || "burger";

  const totalImages = 3;

  let images = [];
  const assets = document.querySelector("#assets");

  // ✅ dynamically preload images
  for(let i = 1; i <= totalImages; i++){
    let img = document.createElement("img");
    img.setAttribute("id", `img${i}`);
    img.setAttribute("src", `images/${productName}/${i}.png`);
    assets.appendChild(img);

    images.push(`#img${i}`);
  }

  let index = 0;
  const product = document.querySelector("#product");

  // ✅ wait for assets load
  window.onload = () => {
    setTimeout(() => {
      product.setAttribute("src", images[index]);
    }, 500); // small delay for AR
  };

  function next(){
    index = (index + 1) % images.length;
    product.setAttribute("src", images[index]);
  }

  function prev(){
    index = (index - 1 + images.length) % images.length;
    product.setAttribute("src", images[index]);
  }
</script>

</body>
</html>
