<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AR 360 View</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<style>
button {
  padding: 10px;
  margin: 5px;
  font-size: 16px;
  border-radius: 8px;
}
</style>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-marker preset="hiro">

    <a-image 
      id="product"
      position="0 0.5 0"
      width="2"
      height="2">
    </a-image>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<!-- CONTROLS -->
<div style="position:fixed; bottom:20px; left:20px; z-index:999;">
  <button onclick="prev()">⬅</button>
  <button onclick="next()">➡</button>
</div>

<script>
// 🔥 GET PRODUCT NAME FROM URL
const params = new URLSearchParams(window.location.search);
const productName = params.get("product") || "burger";

// 🔥 TOTAL IMAGES (CHANGE PER PRODUCT)
const totalImages = 3;

// 🔥 GENERATE IMAGE PATHS AUTOMATICALLY
let images = [];

for(let i = 1; i <= totalImages; i++){
  images.push(`images/${productName}/${i}.png`);
}

// 👉 Example result:
// images/burger/1.png
// images/burger/2.png
// images/burger/3.png

let index = 0;
const product = document.querySelector("#product");

// ✅ LOAD FIRST IMAGE
window.onload = () => {
  product.setAttribute("src", images[index]);
};

// ✅ NEXT
function next(){
  index = (index + 1) % images.length;
  product.setAttribute("src", images[index]);
}

// ✅ PREV
function prev(){
  index = (index - 1 + images.length) % images.length;
  product.setAttribute("src", images[index]);
}
</script>

</body>
</html>
