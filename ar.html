<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AR View</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- Hiro Marker -->
  <a-marker preset="hiro">

    <!-- 3D MODEL (DYNAMIC) -->
    <a-entity
      id="model"
      gltf-model=""
      scale="0.5 0.5 0.5"
      position="0 0 0"
      rotation="0 0 0"
      gesture-control>
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
  const params = new URLSearchParams(window.location.search);
  const model = params.get("model");

  if(model){
    document.querySelector("#model").setAttribute("gltf-model", model);
  }
</script>
<script>
AFRAME.registerComponent('gesture-control', {

  init: function () {
    const el = this.el;

    let scale = 0.5;
    let rotationY = 0;

    // ZOOM (scroll + pinch safe)
    window.addEventListener('wheel', function (e) {
      scale += e.deltaY * -0.001;
      scale = Math.min(Math.max(0.2, scale), 3);
      el.setAttribute('scale', scale + ' ' + scale + ' ' + scale);
    });

    // ROTATE (only one touch system)
    let lastX = null;

    window.addEventListener('touchmove', function (e) {

      if (e.touches.length === 1) {

        let x = e.touches[0].pageX;

        if (lastX !== null) {
          rotationY += (x - lastX) * 0.5;
          el.setAttribute('rotation', '0 ' + rotationY + ' 0');
        }

        lastX = x;
      }
    });

    window.addEventListener('touchend', function () {
      lastX = null;
    });

  }

});
</script>
