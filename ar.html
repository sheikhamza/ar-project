<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AR View</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-marker preset="hiro">

    <a-entity
      id="model"
      gltf-model=""
      scale="0.5 0.5 0.5"
      position="0 0 0"
      rotation="0 0 0"
      gesture-handler>
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
AFRAME.registerComponent('gesture-handler', {

  init: function () {
    const el = this.el;

    let scale = 0.5;
    let rotationY = 0;

    let lastTouchX = null;
    let lastDistance = null;

    // TOUCH START
    window.addEventListener('touchstart', (e) => {

      if (e.touches.length === 2) {
        let dx = e.touches[0].pageX - e.touches[1].pageX;
        let dy = e.touches[0].pageY - e.touches[1].pageY;
        lastDistance = Math.sqrt(dx * dx + dy * dy);
      }

      if (e.touches.length === 1) {
        lastTouchX = e.touches[0].pageX;
      }

    });

    // TOUCH MOVE
    window.addEventListener('touchmove', (e) => {

      // ZOOM (pinch)
      if (e.touches.length === 2) {

        let dx = e.touches[0].pageX - e.touches[1].pageX;
        let dy = e.touches[0].pageY - e.touches[1].pageY;
        let newDistance = Math.sqrt(dx * dx + dy * dy);

        if (lastDistance) {
          let change = newDistance / lastDistance;

          scale *= change;
          scale = Math.min(Math.max(0.2, scale), 3);

          el.setAttribute('scale', `${scale} ${scale} ${scale}`);
        }

        lastDistance = newDistance;
      }

      // ROTATE
      if (e.touches.length === 1) {

        let x = e.touches[0].pageX;

        if (lastTouchX !== null) {
          rotationY += (x - lastTouchX) * 0.5;
          el.setAttribute('rotation', `0 ${rotationY} 0`);
        }

        lastTouchX = x;
      }

    });

    window.addEventListener('touchend', () => {
      lastTouchX = null;
      lastDistance = null;
    });

    // DESKTOP ZOOM
    window.addEventListener('wheel', (e) => {
      scale += e.deltaY * -0.001;
      scale = Math.min(Math.max(0.2, scale), 3);
      el.setAttribute('scale', `${scale} ${scale} ${scale}`);
    });

  }

});
</script>

<script>
  const params = new URLSearchParams(window.location.search);
  const model = params.get("model");

  if(model){
    document.querySelector("#model").setAttribute("gltf-model", model);
  }
</script>

</body>
</html>
