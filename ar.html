<!DOCTYPE html>
<html>
<head>
  <title>AR View</title>

  <!-- model-viewer (Google) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background: transparent;
    }

    .msg {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<model-viewer
  id="viewer"
  src=""
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate
  rotation-per-second="25deg"
  shadow-intensity="1"
  exposure="1.2"
  environment-image="neutral"
  xr-environment
  ar-placement="floor"
  loading="eager">
</model-viewer>

<div id="msg" class="msg" style="display:none;"></div>

<script>
  const viewer = document.getElementById("viewer");
  const msg = document.getElementById("msg");

  // 🔹 URL se model load karo
  const params = new URLSearchParams(window.location.search);
  const model = params.get('model');

  if (model) {
    viewer.src = model;
  } else {
    msg.style.display = "block";
    msg.innerText = "No 3D model found ❌";
  }

  // 🔹 AR support check
  function checkARSupport() {
    if (!navigator.xr) {
      // AR not supported
      viewer.removeAttribute("ar");

      msg.style.display = "block";
      msg.innerText = "AR not supported on your device 😔\nShowing 3D preview only";

    } else {
      // AR supported
      msg.style.display = "block";
      msg.innerText = "Tap 'View in your space' to see in AR 🚀";
    }
  }

  checkARSupport();
</script>

</body>
</html>
